name: Secret Scan

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install, self-test, and run Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.29.1
          GITLEAKS_LINUX_X64_SHA256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          bin_dir="${RUNNER_TEMP}/gitleaks-bin"
          scanner="${bin_dir}/gitleaks"
          download_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --output "${archive}" "${download_url}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" \
            | sha256sum --check --status
          mkdir --mode=0700 "${bin_dir}"
          tar --extract --gzip --file="${archive}" --directory="${bin_dir}" gitleaks
          chmod 0755 "${scanner}"

          # Fail closed if the downloaded scanner cannot detect a known synthetic
          # secret. The fragments avoid committing a scanner-triggering literal.
          canary_label='api_key'
          canary_part_a='a9F2kL7mN4pQ8rT1'
          canary_part_b='vX6zC3bH5jK9sW2y'
          set +e
          printf '%s = "%s%s"\n' "${canary_label}" "${canary_part_a}" "${canary_part_b}" \
            | "${scanner}" stdin --no-banner --redact --log-level error
          canary_exit=$?
          set -e
          if [ "${canary_exit}" -ne 1 ]; then
            echo "Gitleaks canary failed: expected leak exit 1, got ${canary_exit}" >&2
            exit 1
          fi

          "${scanner}" git --no-banner --redact --verbose .
