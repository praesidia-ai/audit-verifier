name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: this workflow only reads the repo and builds/tests it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Node ${{ matrix.node }} — build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      # MIL-0002 F4/F12 — every other repo in this monorepo has a
      # dependency-audit gate (be/ui/mcp/shared/worker/sdk/gateway); this
      # was the one exception. `vitest`/`vite`/`esbuild` are resolved to
      # non-vulnerable versions (see package.json) rather than scoped out
      # with `--omit=dev` — no exception needed today.
      - name: Dependency audit (npm audit --audit-level=high)
        run: npm audit --audit-level=high

      - name: Build (tsc)
        run: npm run build

      - name: Typecheck test targets
        run: npm run typecheck:spec

      - name: Trust-anchor CI regression check (PROD16 FINDING 5)
        run: node scripts/check-trust-anchor-ci.mjs

      - name: Trust-anchor release-policy tests
        run: npm run test:trust-anchor-policy

      - name: Test (vitest)
        run: npx vitest run

      - name: praesidia-verify --help smoke
        run: node dist/cli.js --help

  contract-drift:
    # CD-0002 — no CI job anywhere checked `be`'s bundle producer
    # (`serializeActionEvent`, the manifest builder) against this
    # package's bundle consumer (`BundleActionEvent`, `BundleManifest`,
    # `signableActionEvent`, `verifyManifest`). The two sides agreed only
    # because a human traced every return site by hand — and that already
    # broke for real once (SEC-PA01-DISCOVERED-01). This is our half of the
    # two-sided gate; `be-core` carries the mirrored job in its own
    # `contract-drift.yml` (CD-0002b) so drift is caught from either repo's
    # PR, not just this one.
    name: contract drift · bundle-schema (be producer vs this verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit-verifier (the PR under test)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          path: audit-verifier

      - name: Checkout be-core (bundle producer, sibling repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: praesidia-ai/be-core
          path: be-core
          token: ${{ secrets.BE_CORE_READ_TOKEN || github.token }}

      # Dependency-free regex/brace-depth scrape of both TS sources — no
      # npm install of either project needed (mirrors
      # `gateway/scripts/contract-drift.py`'s technique).
      - name: Diff be's bundle producer against BundleActionEvent/BundleManifest
        run: node audit-verifier/scripts/contract-drift.mjs be-core

  image:
    name: Reproducible image smoke
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The Dockerfile repeats build + tests and its final stage must execute
      # the compiled zero-dependency CLI as a non-root user.
      - name: Build image
        run: docker build -t praesidia-audit-verifier:ci .

      - name: Smoke image and verify runtime user
        run: |
          docker run --rm praesidia-audit-verifier:ci
          USER_NAME="$(docker image inspect --format '{{.Config.User}}' praesidia-audit-verifier:ci)"
          case "${USER_NAME}" in
            ''|0|root) echo "image runs as unsafe user '${USER_NAME}'"; exit 1 ;;
          esac
