name: Publish

# A release is published only from a version tag whose value matches package.json
# and whose commit is contained in main. Protect tag creation/update/deletion with
# the repository ruleset. Configure NPM_TOKEN before cutting a tag.
# The package prepack hook additionally blocks release until the production
# platform trust anchor has been pinned and verified.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # AV-2753 (INFRA-REVIEW CI-12) — every step that executes dependency or repo
  # code (npm ci, tsc, vitest, the prepack build, the npx SBOM tool) runs here,
  # in a job with no `id-token` and no publish secret, so a malicious
  # dependency cannot mint the OIDC token behind a provenance-attested publish.
  # The publish job below only downloads the packed tarball and publishes it.
  # src/__tests__/publish-workflow.spec.ts enforces the split.
  build:
    name: build, test and pack (@praesidia/audit-verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this environment with required reviewers. Its fingerprint
    # variable is the operator-owned approval input from the production key
    # ceremony; the release assertion refuses to trust a fingerprint copied
    # only from this source tree. Both jobs bind it (the variables live here,
    # the npm secret and the publish approval there), so a release asks for
    # approval twice: once before the build, once before the publish.
    environment: audit-verifier-production
    env:
      PRAESIDIA_RELEASE_APPROVED_PLATFORM_KEY_FINGERPRINT: ${{ vars.PRODUCTION_PLATFORM_KEY_FINGERPRINT }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Verify tagged commit is contained in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not contained in main" >&2
            exit 1
          fi

      - run: npm run build
      - run: npm run typecheck:spec
      - run: npm run test:trust-anchor-policy
      - run: npx vitest run

      - name: Verify operator-approved production trust anchor
        run: npm run check:release-trust-anchor

      # AV-0015 — pack the release tarball (prepack repeats the trust-anchor
      # gate), flatten it with the samples into release/ and checksum every
      # file, so `sha256sum -c SHA256SUMS` works in a folder of downloaded
      # assets. Unsigned: a signed checksum needs a key ceremony (user-owed).
      - name: Pack release assets (prepack repeats the trust-anchor gate)
        run: |
          mkdir release
          npm pack --pack-destination release
          cp samples/* release/
          cd release && sha256sum -- * > SHA256SUMS

      # AV-2750 / AV-2752 (audit F02) — the packed CLI in release/, with no key
      # flag, must verify the genuine production fixture with its embedded pin
      # alone (exit 0) and reject that bundle re-signed under a foreign platform
      # key (exit 1, `signature: `). The fixture is the committed file
      # release-fixture/production-audit-package.zip in this repository (on the
      # runner via checkout; not in the npm tarball): an audit package exported
      # from a synthetic org, never customer data, committed by the operator after
      # the key ceremony (AV-2751). Until it is committed this step blocks the
      # release. Not in prepack.
      - name: Verify the packed CLI against the production fixture (embedded pin only)
        env:
          PRAESIDIA_RELEASE_FIXTURE_NO_REKOR: ${{ vars.PRODUCTION_RELEASE_FIXTURE_NO_REKOR }}
        run: npm run check:release-fixture

      - name: Upload release assets as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error

      # AV-0014 — CycloneDX SBOM of the production dependency tree (same
      # tool + flags as be's sbom-release.yml), kept as a workflow artifact.
      # Not in package.json `files`, so it is not shipped in the tarball.
      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  # Only this job can mint the OIDC token, and it never checks out or runs repo
  # or dependency code: it publishes the exact tarball the build job packed,
  # gated and checksummed. Publishing a tarball runs no lifecycle scripts.
  publish:
    name: npm publish (@praesidia/audit-verifier)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: audit-verifier-production
    # MIL-0002 F4 — SLSA/npm provenance requires the OIDC token exchange;
    # `id-token: write` is scoped to this job only (least privilege).
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Re-check checksums
        working-directory: release
        run: sha256sum -c --strict SHA256SUMS

      - name: Publish to npm
        # MIL-0002 F4 — `--provenance` publishes a signed SLSA provenance
        # attestation (build workflow + commit + subject digest) to the npm
        # registry's transparency log, so a customer can confirm the exact
        # published tarball corresponds to this exact CI run/commit, not
        # just trust an npm-token holder's say-so. Requires the `id-token`
        # permission above; npm's publish tooling handles the OIDC exchange.
        # The build job already proved RELEASE_TAG == v<package.json version>.
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TARBALL="praesidia-audit-verifier-${RELEASE_TAG#v}.tgz"
          test -f "$TARBALL"
          npm publish "./${TARBALL}" --access public --provenance

  # AV-0015 — the only job with `contents: write`. Runs after npm publish
  # succeeds, uploads exactly the files SHA256SUMS covers (after re-checking
  # them), and never overwrites an existing asset (no --clobber).
  release-assets:
    name: GitHub release assets (tgz + SHA256SUMS + samples)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release

      - name: Re-check checksums
        working-directory: release
        run: sha256sum -c --strict SHA256SUMS

      - name: Create the release if missing and upload assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes "Verify the download: sha256sum -c SHA256SUMS (see README, Verify the download)."
          fi
          # shellcheck disable=SC2046 # asset names are fixed, no whitespace
          gh release upload "$RELEASE_TAG" SHA256SUMS $(awk '{print $2}' SHA256SUMS)
