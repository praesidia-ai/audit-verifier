name: Publish

# Tag/dispatch-gated npm publish. PUBLISHING IS INTENTIONALLY DISABLED.
# The job is guarded by `if: false` so nothing is ever published until a human
# flips it on. To enable: remove the `if: false` guard and add an NPM_TOKEN
# repository secret. (publishConfig.access is already "public".)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    if: false # DISABLED — remove to enable npm publish
    name: npm publish (@praesidia/audit-verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # MIL-0002 F4 — SLSA/npm provenance requires the OIDC token exchange;
    # `id-token: write` is scoped to this job only (least privilege).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx vitest run

      - name: Publish to npm
        # MIL-0002 F4 — `--provenance` publishes a signed SLSA provenance
        # attestation (build workflow + commit + subject digest) to the npm
        # registry's transparency log, so a customer can confirm the exact
        # published tarball corresponds to this exact CI run/commit, not
        # just trust an npm-token holder's say-so. Requires the `id-token`
        # permission above; npm's publish tooling handles the OIDC exchange.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
