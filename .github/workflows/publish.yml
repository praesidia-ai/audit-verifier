name: Publish

# A release is published only from an immutable version tag whose value matches
# package.json. Configure the NPM_TOKEN repository secret before cutting a tag.
# The package prepack hook additionally blocks release until the production
# platform trust anchor has been pinned and verified.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: npm publish (@praesidia/audit-verifier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # MIL-0002 F4 — SLSA/npm provenance requires the OIDC token exchange;
    # `id-token: write` is scoped to this job only (least privilege).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi

      - run: npm run build
      - run: npx vitest run

      - name: Verify publish artifact and production trust anchor
        run: npm pack --dry-run

      - name: Publish to npm
        # MIL-0002 F4 — `--provenance` publishes a signed SLSA provenance
        # attestation (build workflow + commit + subject digest) to the npm
        # registry's transparency log, so a customer can confirm the exact
        # published tarball corresponds to this exact CI run/commit, not
        # just trust an npm-token holder's say-so. Requires the `id-token`
        # permission above; npm's publish tooling handles the OIDC exchange.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
